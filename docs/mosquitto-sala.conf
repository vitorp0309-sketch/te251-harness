# Broker MQTT do TE-251, no computador da sala (Mosquitto 2.x).
# Windows: copie para C:\Program Files\mosquitto\mosquitto.conf e reinicie o serviço "Mosquitto Broker".
# Detalhes em docs/rede-tailscale.md.

# Escuta em todas as interfaces; o Firewall do Windows libera a porta só para a faixa do Tailscale (100.64.0.0/10).
listener 1883

# O tailnet é privado (só entram máquinas autorizadas pelo administrador), então dá para começar sem senha.
# Para exigir senha: crie o arquivo com  mosquitto_passwd -c C:\mosquitto\senhas.txt te251
# troque as duas linhas abaixo por  allow_anonymous false  e  password_file C:\mosquitto\senhas.txt
# e defina TE251_MQTT_USUARIO / TE251_MQTT_SENHA nos dois computadores.
allow_anonymous true

# Guarda mensagens em disco: se o broker reiniciar, o que estava na fila não se perde.
persistence true
persistence_location C:\mosquitto\dados\

# Se a réplica da sala ficar fora do ar, o broker segura as mensagens para ela.
# O padrão do Mosquitto é 1000 (uns 2 minutos de telemetria); 0 = sem limite.
max_queued_messages 0

log_dest file C:\mosquitto\mosquitto.log
